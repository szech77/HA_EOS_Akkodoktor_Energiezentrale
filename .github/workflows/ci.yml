name: CI

on:
  push:
    branches: [main, "feature/**", "bug/**", "bugfix/**"]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Tests Home Assistant 2026.11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-test.txt
      - name: Behavioral and native Home Assistant tests
        run: python -m pytest -q --cov=custom_components.eos_energiezentrale --cov-branch --cov-report=term-missing
      - name: Browser syntax and authenticated panel bridge
        run: |
          node --check custom_components/eos_energiezentrale/energy/web/loader.js
          node --check custom_components/eos_energiezentrale/energy/web/panel.js
          node --test tests/*.test.cjs
      # Lifecycle scripts stay disabled; the lockfile pins the whole dependency tree.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Frontend type check and component tests
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
      - name: Build the Vue bundle
        working-directory: frontend
        run: npm run build

  security:
    name: Source security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install security tools
        id: tools
        run: python -m pip install -r requirements-dev.txt
      # Preserve scanner failures, but let every scanner and the SARIF upload run.
      - name: Python static security analysis
        id: bandit
        continue-on-error: true
        run: python -m bandit -r custom_components tools -ll --format json --output "$RUNNER_TEMP/bandit.json"
      - name: Audit development and Home Assistant test dependencies
        id: audit
        continue-on-error: true
        run: python -m pip_audit -r requirements-dev.txt -r requirements-test.txt --strict --format json --output "$RUNNER_TEMP/pip-audit.json"
      - name: Audit frontend dependencies
        id: npm_audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Install verified native Semgrep engine
        id: semgrep_tools
        continue-on-error: true
        run: python tools/install_semgrep.py --directory "$RUNNER_TEMP/semgrep" --github-output "$GITHUB_OUTPUT"
      - name: Test versioned Semgrep rules
        id: semgrep_rules
        if: ${{ !cancelled() && steps.semgrep_tools.outcome == 'success' }}
        continue-on-error: true
        run: python tools/semgrep_scan.py --executable "${{ steps.semgrep_tools.outputs.executable }}" --test
      - name: Semgrep Python and JavaScript security analysis
        id: semgrep
        if: ${{ !cancelled() && steps.semgrep_tools.outcome == 'success' && steps.semgrep_rules.outcome == 'success' }}
        continue-on-error: true
        run: python tools/semgrep_scan.py --executable "${{ steps.semgrep_tools.outputs.executable }}" --output "$RUNNER_TEMP/semgrep.json"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true
      - name: Scan repository for secrets
        id: secrets
        continue-on-error: true
        run: trivy fs --scanners secret --exit-code 1 --skip-dirs .git,.venv --format json --output "$RUNNER_TEMP/trivy-secrets.json" .
      - name: Prepare redacted SARIF reports
        id: reports
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: >-
          python tools/security_sarif.py
          --bandit "$RUNNER_TEMP/bandit.json"
          --pip-audit "$RUNNER_TEMP/pip-audit.json"
          --trivy "$RUNNER_TEMP/trivy-secrets.json"
          --semgrep "$RUNNER_TEMP/semgrep.json"
          --output-dir .security-results
      - name: Publish findings to GitHub Code scanning
        id: upload
        if: ${{ !cancelled() && hashFiles('.security-results/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: .security-results
          category: source-security
          wait-for-processing: true
      - name: Enforce scanner and reporting results
        if: ${{ !cancelled() }}
        env:
          BANDIT: ${{ steps.bandit.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          NPM_AUDIT: ${{ steps.npm_audit.outcome }}
          SEMGREP_TOOLS: ${{ steps.semgrep_tools.outcome }}
          SEMGREP_RULES: ${{ steps.semgrep_rules.outcome }}
          SEMGREP: ${{ steps.semgrep.outcome }}
          SECRETS: ${{ steps.secrets.outcome }}
          REPORTS: ${{ steps.reports.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          test "$BANDIT" = success
          test "$AUDIT" = success
          test "$NPM_AUDIT" = success
          test "$SEMGREP_TOOLS" = success
          test "$SEMGREP_RULES" = success
          test "$SEMGREP" = success
          test "$SECRETS" = success
          test "$REPORTS" = success
          test "$UPLOAD" = success

  integration:
    name: Home Assistant and HACS metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate checkout license and repository metadata
        run: python tools/validate_hacs_metadata.py
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: "false"
          # GitHub's description/topics/license belong to the repository/default
          # branch. Pending branches validate their own license in the step above.
          # Keep GitHub metadata checks mandatory once the change reaches main.
          ignore: ${{ github.ref == 'refs/heads/main' && 'brands' || 'brands description license topics' }}

  release_metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate draft and calculate release version
        env:
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ github.ref == 'refs/heads/main' && 'stable' || 'beta' }}
          BUILD: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: >-
          python tools/release.py plan --repository "$REPOSITORY" --commit "$COMMIT"
          --channel "$CHANNEL" --beta-number "$BUILD" --branch "$BRANCH"

  clean_changelog:
    name: Remove released entries from branch draft
    needs: [tests, security, integration]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'szech77/HA_EOS_Akkodoktor_Energiezentrale' &&
      (startsWith(github.ref, 'refs/heads/feature/') ||
      startsWith(github.ref, 'refs/heads/bug/') || startsWith(github.ref, 'refs/heads/bugfix/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Clean branch draft and check the resulting commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: >-
          python tools/release.py clean-branch --repository "$REPOSITORY"
          --commit "$COMMIT" --branch "$BRANCH"

  required:
    name: Required checks
    needs: [tests, security, integration, release_metadata, clean_changelog]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful tests and validation
        env:
          TESTS: ${{ needs.tests.result }}
          SECURITY: ${{ needs.security.result }}
          INTEGRATION: ${{ needs.integration.result }}
          RELEASE: ${{ needs.release_metadata.result }}
          CLEANUP: ${{ needs.clean_changelog.result }}
          CLEANUP_EXPECTED: >-
            ${{ github.event_name == 'push' &&
            github.repository == 'szech77/HA_EOS_Akkodoktor_Energiezentrale' &&
            (startsWith(github.ref, 'refs/heads/feature/') ||
            startsWith(github.ref, 'refs/heads/bug/') || startsWith(github.ref, 'refs/heads/bugfix/')) }}
        run: |
          test "$TESTS" = success
          test "$SECURITY" = success
          test "$INTEGRATION" = success
          test "$RELEASE" = success
          if [ "$CLEANUP_EXPECTED" = true ]; then
            test "$CLEANUP" = success
          else
            test "$CLEANUP" = skipped
          fi

  publish:
    name: Publish stable or beta HACS release
    needs: required
    if: >-
      !cancelled() && needs.required.result == 'success' &&
      github.event_name == 'push' &&
      github.repository == 'szech77/HA_EOS_Akkodoktor_Energiezentrale' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/') ||
      startsWith(github.ref, 'refs/heads/bug/') || startsWith(github.ref, 'refs/heads/bugfix/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Required reviewers are configured in Settings > Environments > release.
    # GitHub waits before starting this job, including its build and write token.
    environment: release
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # HACS installs the release tag; release.py adds this build to the release commit.
      - name: Build the Vue bundle from the checked source
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Publish generated version and immutable release snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          CHANNEL: ${{ github.ref == 'refs/heads/main' && 'stable' || 'beta' }}
          BUILD: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: >-
          python tools/release.py publish --repository "$REPOSITORY" --commit "$COMMIT"
          --channel "$CHANNEL" --beta-number "$BUILD" --branch "$BRANCH"
