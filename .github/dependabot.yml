version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 * * *"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 * * *"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    ignore:
      # Home Assistant pins PyYAML exactly; requirements-dev.txt must use the same
      # version or both files cannot be installed together. PyYAML is raised in the
      # PR that updates homeassistant in requirements-test.txt (see CI.md).
      - dependency-name: "pyyaml"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "cron"
      cronjob: "0 8 * * *"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    # Updates must still pass the 14-day minimum age used for the initial pins.
    cooldown:
      default-days: 14
