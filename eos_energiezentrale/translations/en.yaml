configuration:
  language:
    name: Language
    description: Auto follows the Home Assistant language when available. English is the fallback. You can also select English or German explicitly.
  eos_url:
    name: Akkudoktor EOS API
    description: Base URL including the port, for example http://homeassistant.local:8503.
  timezone:
    name: Time zone for schedules and display
  battery_resource:
    name: EOS battery resource
  vehicle_resource:
    name: EOS vehicle resource
  battery_type:
    name: Battery driver
  wallbox_type:
    name: EV charger driver
  battery_parameters:
    name: Battery driver parameters
    description: JSON object. An empty object uses the driver defaults.
  wallbox_parameters:
    name: EV charger driver parameters
    description: JSON object. An empty object uses the driver defaults.
  pv_entity:
    name: Solar power entity
  house_entity:
    name: Total household consumption entity
  grid_entity:
    name: Grid meter entity
  heat_entity:
    name: Heat pump entity
  price_entity:
    name: Import electricity price entity
  car_soc_entity:
    name: Vehicle state of charge entity
  car_soc_scale:
    name: Vehicle state of charge scale
    description: Use factor for 0 to 1 or percent for 0 to 100.
  capacity_wh:
    name: Usable vehicle battery capacity (Wh)
  charging_efficiency:
    name: Vehicle charging efficiency (factor)
  grid_limit_w:
    name: Maximum grid import (W)
  battery_min_soc:
    name: Lower home battery limit (%)
  battery_max_soc:
    name: Upper home battery limit (%)
  battery_charge_w:
    name: Maximum home battery charging power (W)
  battery_discharge_w:
    name: Maximum home battery discharging power (W)
  allow_battery_export:
    name: Allow forced discharge to the grid
  max_current_a:
    name: Maximum EV charging current (A)
  phase_wait_s:
    name: Phase change wait (s)
  regulation_interval_s:
    name: Initial adjustment interval (s)
  influx_url:
    name: InfluxDB base URL
  influx_database:
    name: InfluxDB database
  influx_user:
    name: InfluxDB username
  influx_password:
    name: InfluxDB password
