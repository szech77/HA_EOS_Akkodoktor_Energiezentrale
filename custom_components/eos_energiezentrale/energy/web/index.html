<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EOS Energiezentrale</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="stylesheet" href="./style.css">
  <script src="./loader.js" defer></script>
</head>
<body id="eos-energy-design">
<!-- The panel is the Vue app built from frontend/ (vue/eos-vue.js); loader.js loads it with the build version. -->
<div id="app"></div>
<!-- Shown by loader.js when the UI files cannot be loaded or fail before the app starts. -->
<div class="energy-app" id="startup" hidden>
  <main>
    <p id="notice" role="status"></p>
    <button id="startup-retry" type="button" hidden>Retry</button>
    <details id="startup-details" hidden><summary id="startup-details-title">Technical details</summary><code id="startup-detail"></code></details>
  </main>
</div>
</body>
</html>
