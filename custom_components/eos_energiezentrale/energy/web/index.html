<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="app.title">EOS Energiezentrale</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="stylesheet" href="./style.css">
  <script src="./bootstrap.js" defer></script>
</head>
<body id="eos-energy-design">
<div class="energy-app">
  <header>
    <a class="brand" href="#overview"><svg class="energy-logo" viewBox="0 0 128 128" aria-hidden="true" focusable="false"><use data-logo href="./logo.svg#mark"/></svg><span class="brand-wordmark"><strong>EOS</strong><span data-i18n="app.name"></span></span></a>
    <nav data-i18n-aria="nav.main">
      <a href="#overview" data-route="overview"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11 12 4l9 7M5 10v10h14V10"/></svg><span data-i18n="nav.overview"></span></a>
      <a href="#car" data-route="car" data-optional="car"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 17H2v-5l3-2 2.5-5h7L18 10l3 1.5V17h-2M8 17h8"/><circle cx="6" cy="17" r="2"/><circle cx="18" cy="17" r="2"/></svg><span data-i18n="nav.car"></span></a>
      <a href="#notices" data-route="notices"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4l2-2M10 21h4"/></svg><span data-i18n="nav.notices"></span><span class="badge" id="nav-badge" hidden></span></a>
      <a href="#settings" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg><span data-i18n="nav.settings"></span></a>
    </nav>
  </header>
  <main>
    <p id="notice" role="status"></p>
    <button id="startup-retry" type="button" hidden>Retry</button>
    <details id="startup-details" hidden><summary id="startup-details-title">Technical details</summary><code id="startup-detail"></code></details>
    <section id="status-band" class="status-band" aria-live="polite" hidden></section>
    <div id="top-notices" class="notices"></div>
    <a id="notice-pill" class="notice-pill" href="#notices" hidden></a>
    <section id="overview">
      <div class="page-top"><div><p class="eyebrow" data-i18n="section.overview"></p><h1 data-i18n="nav.overview"></h1></div></div>
      <div class="kpis" id="overview-kpis"></div>
      <div class="overview-grid">
      <div class="flow-panel">
        <div class="panel-heading"><h2 data-i18n="flow.title"></h2><button type="button" id="flow-weather" class="flow-weather" aria-haspopup="dialog" aria-controls="weather-dialog" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><g id="weather-shape"/></svg><span id="weather-temperature"></span></button></div>
        <div class="flow" id="energy-flow" data-i18n-aria="flow.aria">
          <svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path class="wire" id="flow-wires"/>
            <path class="pulse solar" data-flow="solar" pathLength="100" d="M30 19 Q41 19 45 42"/>
            <path class="pulse grid" data-flow="grid" pathLength="100" d="M30 50 H44"/>
            <path class="pulse battery" data-flow="battery" pathLength="100" d="M45 58 Q41 81 30 81"/>
            <path class="pulse house" data-flow="house" pathLength="100" d="M56 50 Q62 19 70 19"/>
            <path class="pulse car" data-flow="car" pathLength="100" d="M56 50 H70"/>
            <path class="pulse heat" data-flow="heat" pathLength="100" d="M56 50 Q62 81 70 81"/>
            <g id="vehicle-flows"></g>
          </svg>
          <a class="node solar l" style="--x:30%;--y:19%" href="#solar" data-node="solar"><span class="orb" aria-hidden="true">☀</span><span data-i18n="node.solar"></span><strong>—</strong></a>
          <a class="node grid l" style="--x:30%;--y:50%" href="#grid" data-node="grid"><span class="orb" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="m8 21 3-18h2l3 18M7 7h10M5 12h14M9.2 14l5.5 5M14.8 14l-5.5 5M3 7v3m18-3v3M2 7h5m10 0h5M3 12v3m18-3v3M3 21h5m8 0h5"/></svg></span><span data-i18n="node.grid"></span><strong>—</strong></a>
          <a class="node battery l" style="--x:30%;--y:81%" href="#battery" data-node="battery"><span class="orb" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4"/><rect class="battery-bar" x="4" y="9" width="2" height="6" rx="0.45"/><rect class="battery-bar" x="7" y="9" width="2" height="6" rx="0.45"/><rect class="battery-bar" x="10" y="9" width="2" height="6" rx="0.45"/><rect class="battery-bar" x="13" y="9" width="2" height="6" rx="0.45"/><rect class="battery-bar" x="16" y="9" width="2" height="6" rx="0.45"/></svg></span><span data-i18n="node.battery"></span><strong>—</strong></a>
          <a class="hub" href="#usage/total" data-i18n-aria="flow.open_total"><svg class="energy-logo" viewBox="0 0 128 128" aria-hidden="true" focusable="false"><use data-logo href="./logo.svg#mark"/></svg></a>
          <a class="node house r" style="--x:70%;--y:19%" href="#usage/house" data-node="house"><span class="orb" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M10 20v-6h4v6M16 4v3"/><path d="M8 11h.01M16 11h.01"/></svg></span><span data-i18n="node.house"></span><strong>—</strong></a>
          <a class="node car r" style="--x:70%;--y:50%" href="#car" data-node="car"><span class="orb" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 18H2v-6l3-2 2.5-5h6.8L18 10l3 1.5a1.5 1.5 0 0 1 1 1.4V18h-2M8 18h8M5 10h13M11.5 5v5"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><g class="car-soc" hidden><rect class="car-soc-bar" x="6.4" y="10.8" width="1.5" height="4.4" rx=".35"/><rect class="car-soc-bar" x="8.6" y="10.8" width="1.5" height="4.4" rx=".35"/><rect class="car-soc-bar" x="10.8" y="10.8" width="1.5" height="4.4" rx=".35"/><rect class="car-soc-bar" x="13" y="10.8" width="1.5" height="4.4" rx=".35"/><rect class="car-soc-bar" x="15.2" y="10.8" width="1.5" height="4.4" rx=".35"/></g></svg></span><span data-i18n="node.car"></span><strong>—</strong></a>
          <a class="node heat r" style="--x:70%;--y:81%" href="#usage/heat" data-node="heat"><span class="orb" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M3 6c3-5 6 5 9 0s6 5 9 0M3 12c3-5 6 5 9 0s6 5 9 0M3 18c3-5 6 5 9 0s6 5 9 0"/></svg></span><span data-i18n="device.heat"></span><strong>—</strong></a>
          <div id="vehicle-nodes"></div>
        </div>
        <div class="flow-footer"><a class="plan-link" href="#energy" data-i18n="flow.history_link"></a><span class="tag" id="live-time">—</span></div>
      </div>
      <section class="plan-panel" id="plan-panel">
        <div class="panel-heading"><h2 data-i18n="plan.next_title"></h2><span class="tag" data-i18n="device.battery"></span></div>
        <div id="overview-track"></div>
        <p class="mode-detail" id="overview-track-detail" aria-live="polite" data-i18n="plan.track_hint"></p>
        <h3 class="list-title" data-i18n="plan.what_next"></h3>
        <div class="list" id="next-events"></div>
        <a class="plan-link" href="#car" data-optional="car" data-i18n="plan.car_link"></a>
      </section>
      </div>
      <section class="plan-panel" id="day-balance"></section>
    </section>
    <section id="detail" hidden>
      <a class="back" href="#overview" data-i18n="nav.back"></a>
      <div class="page-top"><div><p class="eyebrow" data-i18n="section.device"></p><h1 id="detail-title"></h1></div><a class="back" href="#settings" data-i18n="nav.settings"></a></div>
      <a class="back" id="usage-link" hidden data-i18n="billing.open"></a>
      <div class="kpis" id="detail-kpis"></div>
      <section class="chart-panel">
        <div class="chart-legend"><span data-i18n="chart.measured"></span><span data-i18n="chart.forecast"></span><span data-i18n="chart.now_marker"></span></div>
        <div id="timeline"></div>
        <div id="charts"></div>
      </section>
      <section class="plan-panel" id="plan"></section>
      <section id="vehicle-settings" class="plan-panel" hidden>
        <h2 data-i18n="plans.title"></h2>
        <form id="vehicle-daily">
          <label id="vehicle-selector-label" hidden><span data-i18n="settings.vehicle"></span><select id="vehicle-selector"></select></label>
          <div class="checks">
            <label><input name="pv" type="checkbox"><span data-i18n="settings.pv"></span></label>
            <label><input name="fast" type="checkbox"><span data-i18n="settings.fast"></span></label>
            <label><input name="phase_auto" type="checkbox"><span data-i18n="settings.phase_auto"></span></label>
          </div>
          <div class="fields">
            <label><span data-i18n="settings.pv_target_soc"></span><input name="pv_target_soc" type="number" min="1" max="100" required></label>
            <label><span data-i18n="plans.fast_target"></span><input name="fast_target_soc" type="number" min="1" max="100" required></label>
          </div>
          <h3 data-i18n="plans.goals"></h3><p class="footnote" data-i18n="plans.selection_note"></p>
          <div id="charge-plans" class="charge-plans"></div>
          <button type="button" id="add-charge-plan" data-i18n="plans.add"></button>
          <div class="form-footer"><button type="submit" class="save" data-i18n="settings.save"></button><output id="vehicle-saved" role="status"></output></div>
        </form>
      </section>
    </section>
    <section id="usage" hidden>
      <a class="back" id="usage-back" data-i18n="nav.back"></a>
      <div class="page-top"><h1 id="usage-title"></h1></div>
      <h2 id="billing-range"></h2>
      <div class="billing-toolbar">
        <label><span data-i18n="billing.period"></span><select id="billing-period"><option value="day" data-i18n="billing.day"></option><option value="month" data-i18n="billing.month"></option><option value="year" data-i18n="billing.year"></option></select></label>
        <button data-billing-move="-1" type="button" data-i18n-aria="billing.previous">‹</button>
        <input type="date" id="billing-date" min="2000-01-01" max="2100-12-31" data-i18n-aria="billing.date">
        <button data-billing-move="1" type="button" data-i18n-aria="billing.next">›</button>
        <button data-billing-move="now" type="button" data-i18n="billing.current"></button>
      </div>
      <p id="billing-message" role="status"></p>
      <div class="kpis" id="usage-kpis"></div><div id="usage-charts"></div>
      <section class="plan-panel"><h2 data-i18n="billing.breakdown"></h2><div id="usage-table"></div>
        <details><summary data-i18n="billing.quality"></summary><p id="billing-quality"></p><p data-i18n="billing.inventory_note"></p></details>
      </section>
    </section>
    <section id="notices" hidden>
      <a class="back" href="#overview" data-i18n="nav.back"></a>
      <div class="page-top"><div><p class="eyebrow" data-i18n="section.notices"></p><h1 data-i18n="nav.notices"></h1></div><span class="tag" id="notice-count"></span></div>
      <div class="notices" id="all-notices"></div>
      <section class="plan-panel" id="resolved-panel"><h2 data-i18n="notice_card.resolved_title"></h2><div class="list" id="resolved-notices"></div></section>
      <p class="footnote" data-i18n="control.restart_info"></p>
    </section>
    <section id="settings" hidden>
      <a class="back" href="#overview" data-i18n="nav.back"></a>
      <div class="page-top"><div><p class="eyebrow" data-i18n="section.daily"></p><h1 data-i18n="nav.settings"></h1></div></div>
      <details id="cost-settings-open" class="plan-panel"><summary data-i18n="billing.settings"></summary>
        <form id="cost-settings"><div class="fields">
          <label><span data-i18n="billing.pv_price_source"></span><select name="pv_price_source"><option value="eos" data-i18n="billing.from_eos"></option><option value="manual" data-i18n="billing.manual"></option></select></label>
          <label><span data-i18n="billing.pv_price"></span><input name="pv_price_ct" type="number" min="-1000" max="1000" step="0.01" required></label>
          <label><span data-i18n="billing.efficiency_source"></span><select name="efficiency_source"><option value="eos" data-i18n="billing.from_eos"></option><option value="manual" data-i18n="billing.manual"></option></select></label>
          <label><span data-i18n="billing.charge_efficiency"></span><input name="charge_efficiency" type="number" min="0.1" max="1" step="0.001" required></label>
          <label><span data-i18n="billing.discharge_efficiency"></span><input name="discharge_efficiency" type="number" min="0.1" max="1" step="0.001" required></label>
          <label><span data-i18n="billing.capacity"></span><input name="capacity_wh" type="number" min="100" max="1000000" required></label>
          <label><span data-i18n="billing.initial_price"></span><input name="initial_price_ct" type="number" min="-1000" max="1000" step="0.01"></label>
        </div><p class="footnote" id="pv-cost-effective"></p><p class="footnote" id="cost-effective"></p><p class="footnote" data-i18n="billing.settings_note"></p>
        <div class="form-footer"><button type="submit" class="save" data-i18n="settings.save"></button><output id="cost-saved" role="status"></output></div></form>
      </details>
      <form id="daily">
        <h2 data-i18n="device.battery"></h2>
        <div class="fields">
          <label><span data-i18n="settings.battery_min_soc"></span><input name="battery_min_soc" type="number" min="0" max="99" step="1" required></label>
          <label><span data-i18n="settings.battery_max_soc"></span><input name="battery_max_soc" type="number" min="1" max="100" step="1" required></label>
        </div>
        <p class="footnote" data-i18n="settings.battery_limits_info"></p>
        <p id="battery-limits-status" class="footnote" role="status"></p>
        <label class="check" data-optional="car"><input name="battery_pv_support" type="checkbox"><span data-i18n="settings.pv_support"></span></label>
        <h2 data-optional="car" data-i18n="settings.general_car"></h2>
        <label class="check" data-optional="car"><input name="battery_pv_start" type="checkbox"><span data-i18n="settings.battery_pv_start"></span></label>
        <div class="fields" data-optional="car">
          <label><span data-i18n="settings.reserve"></span><input name="reserve_w" type="number" min="0" max="500" required></label>
          <label><span data-i18n="settings.interval"></span><input name="regulation_interval_s" type="number" min="5" max="120" required></label>
          <label><span data-i18n="settings.battery_pv_min_soc"></span><input name="battery_pv_min_soc" type="number" min="0" max="98" step="1" required></label>
          <label><span data-i18n="settings.battery_pv_wait_s"></span><input name="battery_pv_wait_s" type="number" min="10" max="600" step="1" required></label>
          <label><span data-i18n="settings.battery_pv_surplus_w"></span><input name="battery_pv_surplus_w" type="number" min="1" max="5000" step="1" required></label>
        </div>
        <p class="footnote" data-optional="car" data-i18n="settings.battery_pv_info"></p>
        <fieldset data-optional="car"><legend data-i18n="plans.holiday_settings"></legend><div class="fields">
          <label><span data-i18n="plans.state"></span><select name="holiday_state"><option value="" data-i18n="plans.national"></option><option value="BW">Baden-Württemberg</option><option value="BY">Bayern</option><option value="BE">Berlin</option><option value="BB">Brandenburg</option><option value="HB">Bremen</option><option value="HH">Hamburg</option><option value="HE">Hessen</option><option value="MV">Mecklenburg-Vorpommern</option><option value="NI">Niedersachsen</option><option value="NW">Nordrhein-Westfalen</option><option value="RP">Rheinland-Pfalz</option><option value="SL">Saarland</option><option value="SN">Sachsen</option><option value="ST">Sachsen-Anhalt</option><option value="SH">Schleswig-Holstein</option><option value="TH">Thüringen</option></select></label>
          <label><span data-i18n="plans.locality"></span><select name="holiday_locality"><option value="" data-i18n="plans.no_locality"></option><option value="augsburg">Augsburg</option></select></label>
        </div><label class="check"><input name="holiday_catholic" type="checkbox"><span data-i18n="plans.catholic"></span></label>
        <p class="footnote" data-i18n="plans.region_note"></p></fieldset>
        <div class="form-footer"><button class="save" type="submit" data-i18n="settings.save"></button><output id="saved" aria-live="polite"></output></div>
      </form>
      <section class="plan-panel">
        <h2 data-i18n="settings.setup"></h2>
        <dl id="connections"></dl>
        <p class="footnote" data-i18n="settings.setup_info"></p>
      </section>
    </section>
  </main>
</div>
<dialog id="weather-dialog" aria-labelledby="forecast-title">
  <div class="forecast-heading"><h2 id="forecast-title"></h2><button id="forecast-close" type="button" autofocus>×</button></div>
  <div id="forecast-body"></div>
</dialog>
</body>
</html>
