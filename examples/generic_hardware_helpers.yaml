# Optional helpers for generic plugins. Map real device feedback sensors in the UI.
# Add your own HA automations to translate helper changes into hardware commands.
input_boolean:
  eos_wallbox_laden:
    name: EOS Wallbox charging enabled
input_number:
  eos_wallbox_strom:
    name: EOS Wallbox current
    min: 6
    max: 16
    step: 0.1
    unit_of_measurement: A
  eos_battery_charge_limit:
    name: EOS Battery charge limit
    min: 0
    max: 10000
    step: 10
    unit_of_measurement: W
  eos_battery_discharge_limit:
    name: EOS Battery discharge limit
    min: 0
    max: 10000
    step: 10
    unit_of_measurement: W
input_select:
  eos_wallbox_phasen:
    name: EOS Wallbox requested phases
    options: ["1", "3"]
  eos_battery_mode:
    name: EOS Battery mode
    options: [auto, limits, block_discharge, grid_charge, grid_discharge]
